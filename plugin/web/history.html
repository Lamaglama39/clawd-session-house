<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n>振り返り | Clawd Session House</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="history.css" />
    <script type="module" src="history.js"></script>
  </head>
  <body>
    <header class="hbar">
      <h1 class="htitle">
        <img class="title-mark" src="favicon.svg" alt="" />
        Clawd Session House
      </h1>
      <div class="range" role="group" aria-label="期間" data-i18n-aria-label>
        <button type="button" data-days="1" data-i18n>今日</button>
        <button type="button" data-days="7" aria-pressed="true" data-i18n>7日</button>
        <button type="button" data-days="30" data-i18n>30日</button>
        <button type="button" data-days="90" data-i18n>90日</button>
      </div>
      <div class="dates" role="group" aria-label="日付で指定" data-i18n-aria-label>
        <input type="date" id="from" aria-label="開始日" data-i18n-aria-label />
        <span aria-hidden="true" data-i18n>〜</span>
        <input type="date" id="to" aria-label="終了日" data-i18n-aria-label />
      </div>
      <div class="hbar-right">
        <a class="pill" id="csv" href="api/history/sessions.csv?days=7" download data-i18n
          >CSVをダウンロード</a
        >
        <a class="pill" href="./" data-i18n>ライブ表示</a>
        <div class="lang" role="group" aria-label="表示言語" data-i18n-aria-label>
          <button type="button" data-lang="ja" lang="ja" title="日本語" aria-label="日本語">
            JA
          </button>
          <button type="button" data-lang="en" lang="en" title="English" aria-label="English">
            EN
          </button>
        </div>
      </div>
    </header>

    <main class="hmain" id="main">
      <p class="notice" id="notice" hidden></p>

      <section class="kpis" id="kpis" aria-label="期間の合計" data-i18n-aria-label></section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2 data-i18n>日別の作業時間</h2>
            <p class="sub" data-i18n>処理時間と承認待ち時間を1日ごとに積み上げています</p>
          </div>
          <ul class="legend">
            <li><span class="key" data-series="busy"></span><span data-i18n>処理時間</span></li>
            <li><span class="key" data-series="wait"></span><span data-i18n>承認待ち時間</span></li>
          </ul>
        </div>
        <div class="chart" id="daily-chart"></div>
        <details class="table-view">
          <summary data-i18n>表で見る</summary>
          <table id="daily-table"></table>
        </details>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2 data-i18n>時間帯別の処理時間</h2>
            <p class="sub" data-i18n>
              期間中の処理時間を、作業した時間帯（0〜23時）ごとに合計しています
            </p>
          </div>
        </div>
        <div class="chart" id="hourly-chart"></div>
      </section>

      <div class="cols">
        <section class="card">
          <h2 data-i18n>プロジェクト別</h2>
          <div id="projects"></div>
        </section>
        <section class="card">
          <h2 data-i18n>よく使ったツール</h2>
          <div id="tools"></div>
        </section>
        <section class="card">
          <h2 data-i18n>サブエージェント</h2>
          <div id="agents"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-head">
          <div>
            <h2 data-i18n>セッション</h2>
            <p class="sub" data-i18n>
              行を選ぶと、状態の移り変わりとサブエージェントの動きを表示します
            </p>
          </div>
          <label class="page-size">
            <span data-i18n>表示件数</span>
            <select id="page-size"></select>
          </label>
        </div>
        <div class="table-wrap"><table class="sessions" id="sessions"></table></div>
        <div id="sessions-pager"></div>
        <div class="detail" id="detail" hidden></div>
      </section>
    </main>

    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  </body>
</html>
